// --- 5. 玩家英雄類別 (整合等級與裝備屬性) ---
class Hero {
    constructor(gridX, gridY, classInfo) {
        this.x = gridX * TILE_SIZE + TILE_SIZE / 2;
        this.y = gridY * TILE_SIZE + TILE_SIZE / 2;
        this.classConfig = classInfo;
        
        // 生命值系統
        this.hp = classInfo.maxHp;
        this.maxHp = classInfo.maxHp;
        this.baseSpeed = classInfo.baseSpeed;

        // 【新增】等級與經驗值系統
        this.level = 1;
        this.exp = 0;
        this.maxExp = 100; // 第一級需要 100 EXP

        // 【新增】戰鬥屬性與裝備標記
        this.baseAtk = 2.0;   // 基礎每幀碰撞造成的傷害
        this.equipAtk = 0.0;  // 武器攻擊加成
        this.equipDef = 0.0;  // 防具減免加成
        this.hasSword = false;
        this.hasArmor = false;
    }

    // 【新增】獲得經驗值與升級邏輯
    gainExp(amount) {
        this.exp += amount;
        while (this.exp >= this.maxExp) {
            this.exp -= this.maxExp;
            this.level++;
            this.maxExp = this.level * 100; // 下一級經驗公式
            
            // 升級屬性成長
            this.maxHp += 25;       // 最大血量 +25
            this.hp = this.maxHp;   // 升級直接補滿血 (滿血復活)
            this.baseAtk += 0.6;    // 基礎攻擊力 +0.6
            console.log(`恭喜升級！目前等級：Lv.${this.level}`);
        }
    }

    update() {
        let currentMap = GAME_MAPS[currentMapIndex];
        let gridX = Math.floor(this.x / TILE_SIZE);
        let gridY = Math.floor(this.y / TILE_SIZE);
        let currentTerrain = currentMap.grid[gridY]?.[gridX] || 0;

        let speedModifier = TERRAIN_TYPES[currentTerrain].speedModifier;
        if (currentTerrain === 1 && this.classConfig.ignoreTerrainSlow) {
            speedModifier = 1.0; 
        }
        let currentSpeed = this.baseSpeed * speedModifier;

        let nextX = this.x;
        let nextY = this.y;

        if (pressedKeys['w'] || pressedKeys['arrowup'])    nextY -= currentSpeed;
        if (pressedKeys['s'] || pressedKeys['arrowdown'])  nextY += currentSpeed;
        if (pressedKeys['a'] || pressedKeys['arrowleft'])  nextX -= currentSpeed;
        if (pressedKeys['d'] || pressedKeys['arrowright']) nextX += currentSpeed;

        let nextGridX = Math.floor(nextX / TILE_SIZE);
        let nextGridY = Math.floor(nextY / TILE_SIZE);
        let nextTerrain = currentMap.grid[nextGridY]?.[nextGridX];

        if (nextTerrain !== undefined && TERRAIN_TYPES[nextTerrain].walkable) {
            this.x = nextX;
            this.y = nextY;
        }

        if (currentTerrain === 4) {
            let portalKey = `${gridX},${gridY}`;
            let portalTrigger = currentMap.portals[portalKey];
            if (portalTrigger) {
                currentMapIndex = portalTrigger.targetMap;
                this.x = portalTrigger.spawnGridX * TILE_SIZE + TILE_SIZE / 2;
                this.y = portalTrigger.spawnGridY * TILE_SIZE + TILE_SIZE / 2;
                resizeCanvasForCurrentMap(); 
                spawnEnemiesForMap();        
            }
        }
    }

    draw() {
        ctx.fillStyle = '#3498db';
        ctx.beginPath();
        ctx.arc(this.x, this.y, 10, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#c0392b';
        ctx.fillRect(this.x - 12, this.y - 16, 24, 3);
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(this.x - 12, this.y - 16, 24 * (this.hp / this.maxHp), 3);
    }
}

// --- 6. 野生怪物類別 ---
class WildEnemy {
    constructor(gridX, gridY, typeKey) {
        const config = WILD_ENEMY_TYPES[typeKey];
        this.typeKey = typeKey; // 保留類型名稱用來讀取 EXP
        this.spawnX = gridX * TILE_SIZE + TILE_SIZE / 2;
        this.spawnY = gridY * TILE_SIZE + TILE_SIZE / 2;
        this.x = this.spawnX;
        this.y = this.spawnY;
        
        this.name = config.name;
        this.color = config.color;
        this.maxHp = config.maxHp;
        this.hp = config.maxHp;
        this.baseSpeed = config.baseSpeed;
        this.nativeTerrain = config.nativeTerrain;
        this.enemyType = config.type;

        this.state = 'WANDER';
        this.wanderRadius = 60;
        this.targetX = this.x;
        this.targetY = this.y;
        this.setNewWanderTarget();
    }

    setNewWanderTarget() {
        let angle = Math.random() * Math.PI * 2;
        let distance = Math.random() * this.wanderRadius;
        this.targetX = this.spawnX + Math.cos(angle) * distance;
        this.targetY = this.spawnY + Math.sin(angle) * distance;
    }

    update(mapGrid, hero) {
        let gridX = Math.floor(this.x / TILE_SIZE);
        let gridY = Math.floor(this.y / TILE_SIZE);
        let currentTerrain = mapGrid[gridY]?.[gridX];

        let speedModifier = 1.0;
        if (currentTerrain === 1) speedModifier = 0.5;

        if (currentTerrain === this.nativeTerrain) {
            if (this.enemyType === 'HEAL' && this.hp < this.maxHp) {
                this.hp = Math.min(this.maxHp, this.hp + 0.1);
            }
            if (this.enemyType === 'SPEED_BUFF') {
                speedModifier = 1.4;
            }
        }

        let currentSpeed = this.baseSpeed * speedModifier;
        let dxToHero = hero.x - this.x;
        let dyToHero = hero.y - this.y;
        let distToHero = Math.sqrt(dxToHero * dxToHero + dyToHero * dyToHero);

        if (distToHero < 80) {
            this.state = 'CHASE';
            this.targetX = hero.x;
            this.targetY = hero.y;
        } else if (this.state === 'CHASE') {
            this.state = 'WANDER';
            this.setNewWanderTarget();
        }

        let tDx = this.targetX - this.x;
        let tDy = this.targetY - this.y;
        let tDist = Math.sqrt(tDx * tDx + tDy * tDy);

        if (tDist > 2) {
            this.x += (tDx / tDist) * currentSpeed;
            this.y += (tDy / tDist) * currentSpeed;
        } else if (this.state === 'WANDER') {
            if (Math.random() < 0.01) this.setNewWanderTarget();
        }
    }

    draw() {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#c0392b';
        ctx.fillRect(this.x - 10, this.y - 12, 20, 2);
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(this.x - 10, this.y - 12, 20 * (this.hp / this.maxHp), 2);
    }
}

// --- 7. 商店交易與裝備購買邏輯 ---
function buyShopItem(itemType) {
    if (!player) return;

    if (itemType === 'POTION') {
        if (playerGold >= 20) {
            playerGold -= 20;
            player.hp = Math.min(player.maxHp, player.hp + 50);
        } else { alert("金幣不足！"); }
    } 
    else if (itemType === 'MAX_HP') {
        if (playerGold >= 50) {
            playerGold -= 50;
            player.maxHp += 30;
            player.hp += 30; 
        } else { alert("金幣不足！"); }
    } 
    else if (itemType === 'SPEED') {
        if (playerGold >= 70) {
            playerGold -= 70;
            player.baseSpeed += 0.5;
        } else { alert("金幣不足！"); }
    }
    // 【新增武器防具限購判定】
    else if (itemType === 'SWORD') {
        if (player.hasSword) return;
        if (playerGold >= 100) {
            playerGold -= 100;
            player.equipAtk += 1.5; // 攻擊力加成
            player.hasSword = true;
            
            // 更新按鈕UI狀態
            const btn = document.getElementById('btn-sword');
            btn.innerText = '已裝備';
            btn.disabled = true;
        } else { alert("金幣不足，買不起王者之劍！"); }
    }
    else if (itemType === 'ARMOR') {
        if (player.hasArmor) return;
        if (playerGold >= 120) {
            playerGold -= 120;
            player.equipDef += 0.15; // 固定減傷加成
            player.hasArmor = true;
            
            // 更新按鈕UI狀態
            const btn = document.getElementById('btn-armor');
            btn.innerText = '已裝備';
            btn.disabled = true;
        } else { alert("金幣不足，買不起守護之盾！"); }
    }
}

// --- 8. 控制與初始化核心 ---
function resizeCanvasForCurrentMap() {
    let currentMap = GAME_MAPS[currentMapIndex];
    canvas.width = currentMap.grid[0].length * TILE_SIZE;
    canvas.height = currentMap.grid.length * TILE_SIZE;
}

function spawnEnemiesForMap() {
    enemies = [];
    let mapData = GAME_MAPS[currentMapIndex];
    mapData.enemySpawns.forEach(spawn => {
        enemies.push(new WildEnemy(spawn.x, spawn.y, spawn.type));
    });
}

function initGame(classKey) {
    document.getElementById('ui-container').style.display = 'none';
    document.getElementById('game-wrapper').style.display = 'block';

    resizeCanvasForCurrentMap();
    
    const selectedClass = HERO_CLASSES[classKey];
    player = new Hero(3, 3, selectedClass); 
    spawnEnemiesForMap();

    window.addEventListener('keydown', e => pressedKeys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => pressedKeys[e.key.toLowerCase()] = false);

    requestAnimationFrame(gameLoop);
}

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let currentMap = GAME_MAPS[currentMapIndex];

    for (let r = 0; r < currentMap.grid.length; r++) {
        for (let c = 0; c < currentMap.grid[r].length; c++) {
            let terrainType = currentMap.grid[r][c];
            ctx.fillStyle = TERRAIN_TYPES[terrainType].color;
            ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        }
    }

    player.update();
    player.draw();

    enemies.forEach((enemy, index) => {
        enemy.update(currentMap.grid, player);
        enemy.draw();

        let dx = enemy.x - player.x;
        let dy = enemy.y - player.y;
        let dist = Math.sqrt(dx * dx + dy * dy);

        // 【戰鬥判定整合等級與裝備】
        if (dist < 16) {
            // 計算防具減傷（最少承受 0.1 點傷害，防止完全無敵沒遊戲體驗）
            let finalDamageTaken = Math.max(0.1, 0.5 - player.equipDef);
            player.hp -= finalDamageTaken;

            // 計算最終傷害（基礎攻擊 + 武器加成）
            let finalDamageDealt = player.baseAtk + player.equipAtk;
            enemy.hp -= finalDamageDealt;

            if (enemy.hp <= 0) {
                // 獲得金幣
                playerGold += 20 * player.classConfig.wildKillMult;
                // 獲得該怪物的經驗值
                player.gainExp(WILD_ENEMY_TYPES[enemy.typeKey].exp);
                
                enemies.splice(index, 1);
            }

            if (player.hp <= 0) {
                alert(`冒險結束！你最終達到了 Lv.${player.level}`);
                window.location.reload();
            }
        }
    });

    // --- 9. 即時同步擴充版 HUD 欄位 ---
    let totalAtk = (player.baseAtk + player.equipAtk).toFixed(1);
    let expPercent = Math.floor((player.exp / player.maxExp) * 100);

    document.getElementById('hud-map').innerText = `區域: ${currentMap.name}`;
    document.getElementById('hud-level').innerText = `等級: ${player.level} (${expPercent}%)`;
    document.getElementById('hud-hp').innerText = `血量: ${Math.max(0, Math.floor(player.hp))}/${player.maxHp}`;
    document.getElementById('hud-stats').innerText = `⚔️ ${totalAtk}  🛡️ ${player.equipDef > 0 ? '0.15' : '0.0'}`;
    document.getElementById('hud-gold').innerText = `金幣: ${playerGold}`;

    requestAnimationFrame(gameLoop);
}
</script>
